[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidiff"
version = "0.1.1"
description = "Track which lines in your codebase were written by AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "techino35" },
]
keywords = ["ai", "git", "blame", "code-quality", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "Jinja2>=3.1.0",
    "GitPython>=3.1.0",
]

[project.scripts]
aidiff = "aidiff.cli:app"

[project.urls]
Homepage = "https://github.com/techino35/aidiff"
Repository = "https://github.com/techino35/aidiff"
Issues = "https://github.com/techino35/aidiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["aidiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
